<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>导入提示词到 TypePrompt</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        /* 磨砂玻璃卡片效果 */
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 50px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(to right, #e295ff, #8376ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        /* 流金扫光按钮 */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a18cd1, #fbc2eb);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(161, 140, 209, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 150%; height: 100%;
            background: linear-gradient(to right, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.4) 50%, rgba(255, 255, 255, 0) 100%);
            transform: skewX(-25deg);
            animation: shimmer 3.5s infinite;
        }
        @keyframes shimmer {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }
        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 5px 10px rgba(161, 140, 209, 0.2);
        }
        /* 微信遮罩层 */
        .wx-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 40px 20px;
            text-align: right;
        }
        .wx-arrow {
            width: 60px;
            margin-right: 20px;
            margin-bottom: 20px;
        }
        .wx-text {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            text-align: center;
            line-height: 1.8;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo">📦</div>
        <h1>收到分享提示词</h1>
        <p>您已成功扫描提示词分享海报。<br>点击下方按钮，将直接在您的设备中调起 TypePrompt 并完成无损导入。</p>
        <button class="btn" id="importBtn">立即导入提示词</button>
    </div>

    <!-- 微信内打开的提示浮层 -->
    <div class="wx-overlay" id="wxOverlay">
        <svg class="wx-arrow" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        <div class="wx-text">
            <h2>⚠️ 微信内无法直接启动 App</h2>
            <p style="margin-top: 15px;">请点击屏幕右上角菜单 <b style="color:#a18cd1">•••</b></p>
            <p>选择 <b style="color:#fbc2eb">“在浏览器中打开”</b></p>
            <p>即可自动调起 App 完成导入。</p>
        </div>
    </div>

    <script>
        // 获取 URL 里的 payload 数据
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const payload = getQueryParam('payload');
        const importBtn = document.getElementById('importBtn');
        const wxOverlay = document.getElementById('wxOverlay');

        // 检测是否在微信内打开
        function isWeixin() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        function triggerImport() {
            if (isWeixin()) {
                wxOverlay.style.display = 'block';
                return;
            }

            if (!payload) {
                alert("未检测到有效的分享数据，请确认海报是否完整。");
                return;
            }

            // 拼装 URL Scheme 唤醒 App
            const appLink = "promptvault://import?payload=" + encodeURIComponent(payload);
            window.location.href = appLink;

            // 兜底逻辑：若 2.5 秒后未跳转成功，则说明未安装 App，引导至下载
            setTimeout(() => {
                importBtn.innerText = "下载 TypePrompt 客户端";
                importBtn.style.background = "linear-gradient(135deg, #3f51b5, #00acc1)";
                importBtn.onclick = function() {
                    // 替换成你的 App Store 下载链接
                    window.location.href = "https://apps.apple.com"; 
                };
            }, 2500);
        }

        // 一进页面自动执行一次尝试导入
        window.onload = function() {
            if (payload) {
                setTimeout(triggerImport, 600);
            }
        };

        importBtn.addEventListener('click', triggerImport);
    </script>
</body>
</html>
