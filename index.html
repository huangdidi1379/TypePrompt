<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TypePrompt | 智能提示词导入</title>
    <style>
        :root {
            --primary: #AF52DE;
            --primary-glow: rgba(175, 82, 222, 0.5);
            --bg-color: #09090E;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.6);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }
        /* 极美发光背景效果 */
        .background-glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(94, 92, 230, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(40px);
            pointer-events: none;
            animation: pulse 8s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
        }
        .container {
            z-index: 2;
            text-align: center;
            padding: 48px 32px;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
        }
        .logo-container::after {
            content: '';
            position: absolute;
            width: 70px;
            height: 70px;
            background: var(--primary);
            filter: blur(20px);
            opacity: 0.3;
            z-index: -1;
        }
        .status-title {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }
        .status-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 32px 0;
            line-height: 1.6;
            padding: 0 16px;
        }
        /* 现代环形加载动画 */
        .loader-ring {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.08);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
            margin: 0 auto 36px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(175, 82, 222, 0.3);
        }
        .btn-primary:active {
            transform: scale(0.98);
            background: #963ec4;
        }
        /* 纯 vector CSS 苹果商店下载按钮 */
        .app-store-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 10px 24px;
            color: white;
            text-decoration: none;
            font-family: -apple-system, sans-serif;
            transition: all 0.2s ease;
            width: 100%;
            height: 52px;
            margin-top: 10px;
        }
        .app-store-btn:active {
            background: #111111;
            transform: scale(0.98);
        }
        .app-store-btn svg {
            margin-right: 12px;
            width: 22px;
            height: 22px;
        }
        .app-store-btn .btn-text-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1;
        }
        .app-store-btn .btn-subtitle {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
            color: rgba(255, 255, 255, 0.7);
        }
        .app-store-btn .btn-title {
            font-size: 18px;
            font-weight: 600;
        }
        /* 微信遮罩层样式 */
        .wechat-mask {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(9, 9, 14, 0.95);
            z-index: 9999;
            color: white;
            padding: 40px 24px;
            box-sizing: border-box;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .wechat-mask-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            height: 100%;
            justify-content: center;
        }
        .wechat-arrow {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 60px;
            height: 60px;
            animation: bounce 1.5s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(5deg); }
            50% { transform: translateY(-10px) rotate(-5deg); }
        }
        .wechat-mask h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 16px 0;
        }
        .wechat-mask p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>
    <!-- 主体内容 -->
    <div class="container">
        <div class="logo-container">
            <!-- TypePrompt 官方设计卡片重叠 SVG -->
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Back Card -->
                <rect x="7" y="3" width="13" height="13" rx="3.5" fill="url(#grad2)" fill-opacity="0.4"/>
                <rect x="7.5" y="3.5" width="12" height="12" rx="3" stroke="white" stroke-opacity="0.15"/>
                <!-- Front Card -->
                <rect x="3" y="7" width="13" height="13" rx="3.5" fill="url(#grad1)"/>
                <rect x="3.5" y="7.5" width="12" height="12" rx="3" stroke="white" stroke-opacity="0.25"/>
                
                <defs>
                    <linearGradient id="grad1" x1="3" y1="7" x2="16" y2="20" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#AF52DE"/>
                        <stop offset="1" stop-color="#5E5CE6"/>
                    </linearGradient>
                    <linearGradient id="grad2" x1="7" y1="3" x2="20" y2="16" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#AF52DE"/>
                        <stop offset="1" stop-color="#5E5CE6"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
        
        <h1 class="status-title">正在唤起 TypePrompt</h1>
        <p class="status-desc">系统检测到分享数据，正在安全跳转至您的主应用程序导入提示词...</p>
        
        <div class="loader-ring"></div>
        <div class="action-group">
            <!-- 降级按钮，防止系统未自动唤醒 -->
            <button class="btn btn-primary" onclick="launchApp()">手动跳转导入</button>
            
            <a href="https://apple.com" class="app-store-btn" id="appStoreBtn" target="_blank">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.71,19.5C17.88,20.74 17,21.95 15.66,22C14.32,22.05 13.89,21.24 12.37,21.24C10.84,21.24 10.37,22 9.09,22.05C7.79,22.1 6.8,20.77 5.96,19.56C4.26,17.08 2.97,12.55 4.72,9.5C5.59,8 7.15,7.05 8.85,7C10.14,7 11.36,7.9 12.16,7.9C12.95,7.9 14.4,6.8 15.93,7C16.57,7 18.38,7.2 19.55,8.9C19.46,8.97 17.37,10.18 17.39,12.6C17.42,15.5 19.86,16.5 19.9,16.5C19.88,16.6 19.5,17.9 18.71,19.5M15.97,4.17C16.63,3.37 17.07,2.28 16.95,1C16,1.04 14.9,1.6 14.24,2.38C13.68,3.04 13.19,4.14 13.34,5.39C14.39,5.47 15.4,4.88 15.97,4.17Z"/>
                </svg>
                <div class="btn-text-wrapper">
                    <span class="btn-subtitle">Download on the</span>
                    <span class="btn-title">App Store</span>
                </div>
            </a>
        </div>
    </div>
    <!-- 微信拦截遮罩 -->
    <div class="wechat-mask" id="wechatMask">
        <svg class="wechat-arrow" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="9 7 17 7 17 15"></polyline>
        </svg>
        <div class="wechat-mask-content">
            <h2>微信端无法直接唤起 App</h2>
            <p>请点击右上角【...】按钮<br>在浏览器（如 Safari）中打开，即可一键自动跳转导入提示词。</p>
        </div>
    </div>
    <script>
        // TODO: 等您的 App 上架后，把这里的链接替换为真实的 App Store 下载链接！
        const APP_STORE_LINK = "https://apps.apple.com/app/id6738927453"; // 占位链接，上架后请替换为真实 app id
        function getDeepLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const payload = urlParams.get('payload');
            if (payload) {
                // 主 App 注册的 URL Scheme，唤醒后跳转导入
                return "promptvault://import?payload=" + encodeURIComponent(payload);
            }
            return null;
        }
        function launchApp() {
            const deepLink = getDeepLink();
            if (deepLink) {
                window.location.href = deepLink;
                
                // 延迟 2.5 秒，如果网页仍然可见（代表未安装 App），则重定向至 App Store 下载页面
                setTimeout(function() {
                    window.location.href = APP_STORE_LINK;
                }, 2500);
            } else {
                // 如果没有 payload 参数，直接进入 App Store
                window.location.href = APP_STORE_LINK;
            }
        }
        window.onload = function() {
            // 1. 微信 / QQ 拦截判断
            const ua = navigator.userAgent.toLowerCase();
            const isWechat = ua.indexOf('micromessenger') !== -1 || ua.indexOf('qq/') !== -1;
            if (isWechat) {
                document.getElementById('wechatMask').style.display = 'block';
                return;
            }
            // 更新 App Store 链接
            document.getElementById('appStoreBtn').href = APP_STORE_LINK;
            // 2. 正常浏览器下直接尝试自动唤醒
            launchApp();
        };
    </script>
</body>
</html>
